
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a1a">
<title>My Day</title>


<style>
* { box-sizing: border-box; }

body {
    body.light {
    background: #f4f4f4;
    color: #222;
}

body.light .container {
    background: #ffffff;
}

body.light .date-box,
body.light .progress-box,
body.light li {
    background: #eeeeee;
    color: #222;
}

body.light input,
body.light select {
    background: #ffffff;
    color: #222;
    border-color: #ccc;
}

body.light .subtitle,
body.light footer {
    color: #666;
}
    margin: 0;
    padding: 20px;
    background: #171717;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 700px;
    margin: 40px auto;
    padding: 30px;
    background: #242424;
    border-radius: 18px;
}

h1, .subtitle, footer { text-align: center; }
h1 { font-size: 38px; }
.subtitle, footer { color: #aaa; }

.date-box {
    padding: 15px;
    margin: 25px 0;
    background: #333;
    border-radius: 10px;
    text-align: center;
}

.input-area {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    background: #333;
    color: white;
    border: 1px solid #555;
    border-radius: 8px;
}

button {
    padding: 12px 20px;
    background: #555;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

ul {
    padding: 0;
    list-style: none;
}

li {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    padding: 14px;
    background: #383838;
    border-radius: 8px;
}

.task-text {
    flex: 1;
    cursor: pointer;
    overflow-wrap: anywhere;
}

.priority-عاجلة {
    border-right: 5px solid #ff4444;
}

.priority-متوسطة {
    border-right: 5px solid #ffc107;
}

.priority-عادية {
    border-right: 5px solid #4caf50;
}
li.late {
    border: 2px solid #ff4444;
    background-color: #3b2020;
}
.done .task-text {
    text-decoration: line-through;
    color: #999;
}

.delete {
    background: #733d3d;
}
.progress-box {
    margin: 25px 0;
    padding: 18px;
    background: #333;
    border-radius: 10px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
}

.progress-bar {
    width: 100%;
    height: 12px;
    background: #555;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: #4caf50;
    border-radius: 20px;
    transition: width 0.4s;
}
footer { margin-top: 30px; }

@media(max-width: 500px) {
    body {
        padding: 10px;
    }

    .container {
        margin: 10px auto;
        padding: 15px;
        border-radius: 12px;
    }

    h1 {
        font-size: 28px;
    }

    .input-area {
        flex-direction: column;
    }

    .input-area input,
    .input-area select,
    .input-area button {
        width: 100%;
    }

    li {
        flex-wrap: wrap;
        padding: 10px;
    }

    li button {
        padding: 9px 12px;
    }

    .filter-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .filter-buttons button {
        flex: 1;
    }
}
.brand-name {
    color: #d4af37;
    font-family: Georgia, serif;
    font-size: 16px;
    font-style: italic;
    letter-spacing: 3px;
    text-align: center;
    margin: 8px 0 20px;
    text-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
}
#themeButton {
    width: auto;
    padding: 7px 14px;
    font-size: 13px;
    display: block;
    margin: 10px auto;
    border-radius: 20px;
}
</style>
</head>

<body>
<div class="container">

    <h1>🖤 My Day</h1>
    <div class="brand-name">Golden Soul</div>
    <button id="themeButton" type="button">
    ☀️ الوضع النهاري
</button>
   <p class="subtitle">خطوة جديدة نحو أهدافك كل يوم ✨</p>



<div class="motivation-box" id="motivationMessage">
    ✨ كل إنجاز كبير يبدأ بخطوة صغيرة.
</div>
    <div class="date-box">
        <h3 id="todayDate"></h3>
        <h3 id="todayTime"></h3>
    </div>
<h2>مهامي اليومية ✨</h2>

<div class="input-area">
    <input id="taskInput" type="text"
           placeholder="اكتبي المهمة الجديدة...">

    <select id="taskPriority">
        <option value="عادية">🟢 عادية</option>
        <option value="متوسطة">🟡 متوسطة</option>
        <option value="عاجلة">🔴 عاجلة</option>
    </select>

    <input id="taskDate" type="date">

    <button id="addButton" type="button">إضافة +</button>
</div>

<div class="progress-box">
    <div id="taskStats" style="text-align:center; margin-bottom:15px;">
    إجمالي المهام: 0 | المكتملة: 0 | المتبقية: 0
</div>
    <div class="progress-info">
        <span>إنجازك اليوم 🎯</span>
        <span id="progressText">0%</span>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>
</div>
    <div class="filter-buttons">
    <button onclick="filterTasks('all')">كل المهام</button>
    <button onclick="filterTasks('عاجلة')">🔴 عاجلة</button>
    <button onclick="filterTasks('متوسطة')">🟡 متوسطة</button>
    <button onclick="filterTasks('عادية')">🟢 عادية</button>
    <button onclick="filterTasks('done')">المكتملة</button>
</div>
    <button id="clearButton" type="button">
    مسح المهام المكتملة 🗑️
</button>
    <ul id="taskList"></ul>

    <footer>كل يوم جديد فرصة جديدة 🖤</footer>
</div>

<script>
let tasks = [];
let currentFilter = "all";
try {
    const saved = JSON.parse(localStorage.getItem("myTasks") || "[]");

    if (Array.isArray(saved)) {
        tasks = saved.map(task => ({
    text: typeof task === "string" ? task : task.text,
    done: typeof task === "object" ? !!task.done : false,
    priority: typeof task === "object" ? (task.priority || "عادية") : "عادية"
})).filter(task => task.text);
    }
} catch (error) {
    tasks = [];
}

function saveTasks() {
    localStorage.setItem("myTasks", JSON.stringify(tasks));
}
function updateProgress() {
    const total = tasks.length;
    const completed = tasks.filter(task => task.done).length;
const remaining = total - completed;

document.getElementById("taskStats").textContent =
    `إجمالي المهام: ${total} | المكتملة: ${completed} | المتبقية: ${remaining}`;
    const percentage = total === 0
        ? 0
        : Math.round((completed / total) * 100);

    document.getElementById("progressText").textContent =
        percentage + "%";

    document.getElementById("progressFill").style.width =
        percentage + "%";
}
function showTasks() {
    const list = document.getElementById("taskList");
    list.innerHTML = "";

    tasks.forEach((task, index) => {
        if (currentFilter === "done" && !task.done) return;

if (
    currentFilter !== "all" &&
    currentFilter !== "done" &&
    (task.priority || "عادية") !== currentFilter
) return;
        const li = document.createElement("li");
li.classList.add("priority-" + (task.priority || "عادية"));
        if (task.done) li.classList.add("done");
const today = new Date().toISOString().split("T")[0];

if (task.date && task.date < today && !task.done) {
    li.classList.add("late");

    const lateLabel = document.createElement("small");
    lateLabel.textContent = " — متأخرة 🔴";
    li.appendChild(lateLabel);
}
        const span = document.createElement("span");
        span.className = "task-text";
        const priorityLabel = task.priority || "عادية";
      const taskDate = task.date ? " 📅 " + task.date : "";
span.textContent = task.text + " — " + priorityLabel + taskDate;

        span.onclick = function() {
            tasks[index].done = !tasks[index].done;
            saveTasks();
            showTasks();
        };

        const del = document.createElement("button");
        del.textContent = "حذف";
        del.className = "delete";
const edit = document.createElement("button");
edit.textContent = "تعديل ✏️";
edit.className = "edit";

edit.onclick = function() {
    const newText = prompt("اكتبي اسم المهمة الجديد:", task.text);

    if (newText === null || newText.trim() === "") {
        return;
    }

    tasks[index].text = newText.trim();
    saveTasks();
    showTasks();
};
        del.onclick = function() {
            tasks.splice(index, 1);
            saveTasks();
            showTasks();
        };

        li.appendChild(span);
li.appendChild(edit);
li.appendChild(del);
list.appendChild(li);

    });


    updateProgress();
}

function filterTasks(filter) {
    currentFilter = filter;
    showTasks();
}
function clearCompleted() {
    tasks = tasks.filter(task => !task.done);

    saveTasks();
    showTasks();
}
function addTask() {
    const input = document.getElementById("taskInput");
    const value = input.value.trim();
    const priority = document.getElementById("taskPriority").value;
const date = document.getElementById("taskDate").value;
    if (value === "") {
        alert("اكتبي المهمة الأول ❤️");
        return;
    }

    tasks.push({
    text: value,
    done: false,
    priority: priority,
    date: date
});

    input.value = "";
    document.getElementById("taskDate").value = "";
    saveTasks();
    showTasks();
}
document.getElementById("addButton").addEventListener("click", addTask);
document.getElementById("clearButton").addEventListener("click", clearCompleted);
document.getElementById("taskInput").addEventListener("keydown", function(event) {
    if (event.key === "Enter") addTask();
});
function updateClock() {
    const now = new Date();

    document.getElementById("todayDate").textContent =
        now.toLocaleDateString("ar-EG");

    document.getElementById("todayTime").textContent =
        now.toLocaleTimeString("ar-EG");
}
const savedTheme = localStorage.getItem("myTheme");

if (savedTheme === "light") {
    document.body.classList.add("light");
    themeButton.textContent = "🌙 الوضع الليلي";
}

themeButton.addEventListener("click", function() {
    document.body.classList.toggle("light");

    if (document.body.classList.contains("light")) {
        themeButton.textContent = "🌙 الوضع الليلي";
        localStorage.setItem("myTheme", "light");
    } else {
        themeButton.textContent = "☀️ الوضع النهاري";
        localStorage.setItem("myTheme", "dark");
    }
});

const motivationMessages = [
    "✨ كل إنجاز كبير يبدأ بخطوة صغيرة.",
    "🌸 اليوم فرصة جديدة لتحقيق الأفضل.",
    "💪 الاستمرار أهم من السرعة.",
    "🎯 نظّم وقتك، واقترب من أهدافك.",
    "🖤 لا تستسلم، فالنجاح يحتاج إلى صبر.",
    "🌟 كل خطوة تقرّبك من هدفك.",
    "☀️ ابدأ يومك بهدف واضح وخطوة جديدة."
];

const today = new Date().getDate();
const messageIndex = today % motivationMessages.length;

document.getElementById("motivationMessage").textContent =
    motivationMessages[messageIndex];
updateClock();
setInterval(updateClock, 1000);
showTasks();
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function() {
        navigator.serviceWorker.register("./service-worker.js")
            .then(function() {
                console.log("Golden Soul is ready!");
            })
            .catch(function(error) {
                console.log("Service Worker Error:", error);
            });
    });
}
</script>
</body>
</html>
